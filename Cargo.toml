[package]
name = "openqup"
version = "0.1.2"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/iagonunez/openqup"
description = "Installs OpenQ by building it from source, with its build dependencies"
publish = false

[dependencies]
anyhow = "1.0.100"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
ureq = { version = "3.4", default-features = false, features = ["gzip"] }

# TLS with the system's trusted certificates (so company proxies and the OS's root updates work):
# rustls on Linux, the OS's own TLS (SChannel / Security.framework) on Windows and macOS.
[target.'cfg(target_os = "linux")'.dependencies]
ureq = { version = "3.4", default-features = false, features = ["rustls", "platform-verifier"] }
[target.'cfg(not(target_os = "linux"))'.dependencies]
ureq = { version = "3.4", default-features = false, features = ["native-tls"] }

[profile.release]
strip = true
lto = "thin"
